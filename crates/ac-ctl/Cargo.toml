[package]
name = "ac-ctl"
description = "Command-line driver for the agent fleet (create, pause, resume, destroy, status) and the host's settings (doctor, tune)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ac-domain = { path = "../ac-domain" }
ac-ports = { path = "../ac-ports" }
ac-fleet = { path = "../ac-fleet" }
ac-ctr = { path = "../ac-ctr" }
ac-store = { path = "../ac-store" }
platform-linux.workspace = true
rusty_json.workspace = true
rusty_atomic_file.workspace = true
# Only for `DirLock`, already in the build through ac-store.
rusty_multimodal_db_engine.workspace = true

[lints]
workspace = true
