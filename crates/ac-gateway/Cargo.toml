ac-ports = { path = "../ac-ports" }
ac-fleet = { path = "../ac-fleet" }
ac-ctr = { path = "../ac-ctr" }
ac-store = { path = "../ac-store" }
ac-history = { path = "../ac-history" }
ac-viewer = { path = "../ac-viewer" }
platform.workspace = true
platform-linux.workspace = true
rusty_serve.workspace = true
rusty_http.workspace = true
rusty_json.workspace = true

[dev-dependencies]
ac-fleet = { path = "../ac-fleet" }
platform-mock.workspace = true

[lints]
workspace = true
