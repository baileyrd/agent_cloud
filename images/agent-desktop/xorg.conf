# Headless display :0 on the dummy driver: no GPU, no input devices, no VT.
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
EndSection

Section "Device"
    Identifier "dummy"
    Driver "dummy"
    # KiB: 1920x1080 at 32 bpp needs 8100; leave room for xrandr up to 2560x1600.
    VideoRam 32768
EndSection

Section "Monitor"
    Identifier "monitor0"
    HorizSync 5.0 - 1000.0
    VertRefresh 5.0 - 200.0
EndSection

Section "Screen"
    Identifier "screen0"
    Device "dummy"
    Monitor "monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 2560 1600
        Modes "1920x1080" "1600x900" "1280x800"
    EndSubSection
EndSection
